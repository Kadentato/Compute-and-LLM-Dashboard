name: collect-gpu

# GPU price collector for the compute dashboard (compute/). Separate file
# from collect.yml on purpose: editing that one re-registers its schedules
# and has caused multi-hour cold starts before. Do not merge the two.
on:
  schedule:
    # Ornn settles its daily OCPI values at 20:00 UTC; first slot runs after
    # that. Second slot is a catch-up — runs that fetch nothing new skip
    # their commit, so the extra slot costs nothing.
    - cron: "41 21 * * *"
    - cron: "19 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-gpu
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7 on both, matching collect.yml. Proven there over six scheduled runs
      # including real pushes, which is the path checkout v6 changed by moving the
      # persisted credential to a separate file.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect
        run: python collector/collect_gpu.py
      - name: Commit if new data arrived
        # collect_gpu.py isolates per-source failures, derives from whatever raw it
        # has, and only THEN exits 1 so the run goes red. Without always(), that exit
        # skipped this step and threw away the sources that did work — which is what
        # happened on 2026-09-05, when one transient fetch discarded the other four.
        # collect.yml has had this since it was written; this file did not.
        if: always()
        run: |
          git config user.name "Caden Huang"
          git config user.email "302154085+Kadentato@users.noreply.github.com"
          # Stage whole directories, not named files: adding a source and forgetting
          # to list it here left its file modified-but-unstaged, which made
          # `pull --rebase` refuse and killed the run (2026-09-01). Naming
          # gpu_live.json had the same shape of bug waiting — gpu_history.json
          # would have been derived every run and committed by none of them.
          git add data/raw compute/dataFiles
          if git diff --cached --quiet; then
            echo "No new data; skipping commit."
          else
            git commit -m "GPU price data: $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push origin main
          fi
