name: collect

on:
  schedule:
    # GitHub's scheduler is best-effort and can delay events for hours on young
    # repos. Five scattered slots make the earliest-delivered one win; runs that
    # fetch nothing new skip their commit, so extra slots cost nothing.
    - cron: "23 6 * * *"
    - cron: "37 9 * * *"
    - cron: "53 12 * * *"
    - cron: "11 16 * * *"
    - cron: "41 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python collector/collect.py
      - name: Commit data if changed
        if: always()   # a failing source must not block the others' data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # commit only when new RAW data arrived; derived/status timestamp
          # churn alone (a later same-day run that fetched nothing) is skipped
          if git diff --cached --quiet -- data/raw; then
            echo "no new raw data - skipping commit"
          else
            git commit -m "data: $(date -u +%F)"
            # `git add data/` above already stages every raw source, so this job was
            # never exposed to the unstaged-file failure that hit collect-gpu on
            # 2026-09-01. What it IS exposed to is a push race with the other
            # workflow or a manual push, which rejected a run on 2026-09-03: refetch
            # and retry once. --autostash is belt-and-braces for anything the add misses.
            git pull --rebase --autostash origin main || true
            git push || (git pull --rebase --autostash origin main && git push)
          fi
